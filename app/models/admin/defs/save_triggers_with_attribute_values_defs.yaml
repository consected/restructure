# Save Trigger: `with:` attribute value types
# These value types apply to `with:` in create_reference, update_reference, update_this,
# and preset_fields triggers. Each field value can be set using one of the following formats:
#
# Canonical schema
# with: <Hash(field_name: AttributeValueExpr)>
#
# AttributeValueExpr type
# AttributeValueExpr: <
#   String literal |
#   now() |
#   {{curly_tag}} substitution |
#   {{{curly_tag}}} raw substitution (preserves type, e.g. for JSON/Hash fields) |
#   ReturnValueLookup |
#   Hash(object: Hash) (literal Hash/JSONB passthrough)
# >
#
# ReturnValueLookup type
# ReturnValueLookup: <Hash(this | reference_<reference_name>: Hash(field_name: 'return_value'))>
#
            with: 
              field_name: 'now()'
              field_name_2: 'literal value'
              field_name_3: 
                this: 
                  field_name: return_value
              field_name_4: 
                reference_name:
                  field_name: return_value
              field_name_5: '\{\{curly_tag\}\} - \{\{curly_tag2\}\}'
              field_name_6: '\{\{\{data.data_structure\}\}\}' # Get a data structure as original object, for JSON fields etc                  
              jsonb_field_name:
                object:
                  key1: value1
                  key2: value2
                  nested_key:
                    inner: inner_value
              # Use 'object' to store a literal object (Hash) to a JSONB database field.
              # Without the wrapper, a Hash value would be interpreted as a conditional action query.
              # The 'object' key must be the only key in the Hash to be recognized as a passthrough.
              embedded_item:
                field_name: 'literal value'
                field_name_2: 
                  reference_name:
                    field_name: return_value

# Notes:
# - A plain Hash value (without an `object:` wrapper) is interpreted as a ReturnValueLookup
#   conditional query, not a literal value - use `object:` to store a literal Hash/JSONB value.
# - embedded_item is a pseudo-key: values under it are assigned to the item's embedded_item
#   instead of the item itself.
