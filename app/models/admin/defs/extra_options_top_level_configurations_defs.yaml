# _configurations options
_configurations:
  use_current_version: force the use of the current definition version when defining a dynamic class
  secondary_key: field name to use as a secondary key to lookup items
  view_sql: define a view instead of a table to underpin this model
  prevent_migrations: false (default) | true - prevent field / comment changes attempting to run DB migrations
  batch_trigger: 
    # Fire **batch_trigger:** task for each record, based on the batch_trigger in **default:** or activity log options
    # All records (up to the limit) will be triggered on the specified frequency.
    # In order to make the selection of the records in the batch conditional, consider using a dynamic_model with *view_sql*
    frequency: n units OR 'once' - for example 1 hour, 15 minutes, or 30 days. If set to 'once' then it will run once in ten seconds after saving
    run_at: time (or list of times) to run at on the frequency specified, for example '12:00', '6:00pm', 'sunday 8:00am' (with frequency '1 week')
    limit: maximum number of records to process in a single batch
    if: conditions on the records to select for processing
    # By default, the user in the process record will be used to perform the batch action. If no user_id field is specified in
    # the model, or you wish to use an alternative, specify one of the following instead
    app_type: optionally specify an app_type id to force the use of a batch user when perfoming actions
    user: optionally specify a user id (or email) to force use of the specified user when perfoming actions
  tab_caption: a markdown string to be shown at the top of activity log panels (between header title and action buttons)
  uniqueness_fields: check for uniqueness of an external identifier based on multiple fields, rather than the external id attribute alone
    # Provide a list of fields (including the external id attribute name if required) to check uniqueness against. 
    # If no uniqueness check is required, specify 'id'.
    # NOTE: searches through the UI against the external ID (using the default capabilities)
    # may now return multiple results, since there is currently no way to specify the other fields that make up a unique search.
  can_change_master: allow assigned external identifiers to be moved to a different master record
  foreign_key_through_external_id: external identifier resource name to join to master through when the *foreign key name* is defined
    # Allows a dynamic model to be have a master association without a master_id (or other crosswalk attribute) column configured on the
    # table. Instead, the column name specified in the *foreign key name* definition name the field this model, the value
    # of which is then used to look up the external identifier record of type defined in this configuration. This then makes the connection
    # back to the master record.
    # The inverse of this is that the master record can create one of these dynamic models if an external identifier of this type has been created.
    # If multiple external ids are associated with this master record, the most recent one will be used.
    #
    # For example, a dynamic model definition could look like this:
    #   *Foreign key name*
    #     alt_id
    #   *Field list*
    #     notes alt_id
    #   *Options*
    #     _configurations:
    #       foreign_key_through_external_id: ipa_assignments
    # This would then use the value of alt_id in the dynamic model record to find its associated master through a
    # ipa_assignments external identifier associated with the master record.
    #
    # Another common use case might be to have the *Foreign key name* set to "redcap_survey_identifier" and the
    # *foreign_key_through_external_id:* configuration would specify the external identifier type to use to lookup the associated master.
  no_user_id: true|false (default)
    # The table should be created without a user_id field or foreign key onto `users.id` and association to the User model.
