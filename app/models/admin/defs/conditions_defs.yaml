# Conditions Definitions

        all:
          'model_table_name | this | embedded_item | this_references | parent_references | parent_or_this_references | referring_record (the record referring to this one)':
            field_name: 'all conditional values must be true in model_table_name (any matching record unless id or other filters specified separately) or this (this record)'
            field_name_2: 'literal value | null'
            field_name_3: 
              this: 'attribute in this record' 
            field_name_4: 
              this_references: 'attribute in any referenced record' 
            field_name_5:
              this: previous_value_of_<some attribute> - gets the previous value of a field before it was changed in this transaction
            field_name_6: # Match the element if it is IN this list
              - item1
              - item2
              - item3
            
            # Check if the latest record matched on the previous conditions also matches the `and_latest_matches` conditions
            # This is useful for checking a list of possible extra_log_type and only matching if the latest one
            # is a specific activity. This can't be achieved through other mechanisms, such as nested conditions,
            # since they limit the results.
            # 
            extra_log_type:
              - lock
              - unlock
            and_latest_matches: 
              extra_log_type: unlock              

            return_constant: 'value to return if previous condition matches'
            field_to_return: 'return_value'
            field_to_return_if_also_a_condition:
              - match1 
              - match2 
              - return_value
            list_field_to_return: 'return_value_list'
            return: 'return_result (return the actual matched instance)'
          
        
        any:
          model_table_name:
            field_name: 'any conditional value must be true'
          model_table_name2:
            # Get an array of ids for a specified set of "from" items
            # where the items reference a "target" item, based on a filter
            # This is different from `this_references` since "from" is unrelated
            # to the current instance
            id:
              ids_referencing:
                target:
                  external_items:
                    rec_type: val
                from:
                  activity_log_items:
                    extra_log_type: act1
                    return: return_all_results
        not_any:
          model_table_name:
            field_name: 'all conditional values must be false'
          
        
        not_all:
          model_table_name:
            field_name: 'any conditional value must be false'

        # Only creatable if this extra log type hasn't already been performed
        # `definition_resources` resolves to the definition activity log association for an activity log
        # or the dynamic model / external identifier association otherwise
        not_any_completed:
          definition_resources:
            extra_log_type: '{{extra_log_type}}'

        any_return_an_embedded_item:
          embedded_item:
            return: return_result
        
        any_return_attribute_from_an_embedded_item:
          embedded_item:
            some_field: return_value

        any_calculation:
          this:
            calculate:
              # Returns value
              (sum|min|max|count_not_null|mean):
                attributes:
                  - attr1
                  - attr2

        any_comparison_using_a_calculation:
          this:
            field_name:
              # Returns a result if it matches
              calculate:
                (sum|min|max):
                  attributes:
                    - attr1
                    - attr2
              
                                    

        all - users not related to master:
          # if the first key is 'users' then the query will return against all users rather than current master record
          users:
            email: 'address to find user by'
            disabled:
              - null
              - false
            id: return_value

        all - no masters:
          # if a key is specified as 'no_masters', then the first key in the list will be used as the base table
          # for the query. Results will not be joined to the masters table, allowing for arbitrary tables and views to be
          # used to calculate conditions, even if they don't have a master_id or the master_id field can be null.
          # Additional associations can be specified, but they must be defined within the new base table.
          # NOTE: This may lead to errors with associations that are not defined in the new base table, even when attempting to
          # perform a comparison against "this" - for example, the following may fail:
          #  all:
          #    player_contacts:
          #      data:
          #        this: email
          # Instead, try the following, which substitutes the email value into the comparison, outside of any associations:
          #  all:
          #    player_contacts:
          #      data: '{{email}}'
          no_masters: {}
          dynamic_model__some_tables:
            id: 123
            return: return_result

        all - crosswalk:
          # no_masters can also be used to look up against the crosswalk identifiers. For example, get the
          # master.id for the provided msid
          no_masters: {}          
          masters:
            msid: 12345
            id: return_value

        all - masters:
          # if the first key is 'masters' and the value an empty hash then the query will return against all masters rather than current master record
          masters: {}
          player_contacts:
            data: '(516)123-7612 22'
            master_id: return_result

        all - filtered to a set of masters:
          # if the first key is 'masters' with conditions then the query will return against a set of masters rather than current master record
          masters:
            id:
              - 1
              - 2          
          player_contacts:
            data: (516)123-7612 22
            master_id: return_result
          
        all_with_nested_conditions:
          model_table_name:
            field_name: 'all conditional values must be true'                     
          'all|any|not_all|not_any':
            'nested conditions...': {}

      
        'all_2|not_any_3...': 'allows for repeat of the condition type'
        'all|any|not_all|not_any':
            - repeated_model_table_name: {}
            - repeated_model_table_name: {}
          
        all_special_conditions:
          model_table_name:
            field_special_condition:
              condition: |
                "one of:"
                - 'IS NOT NULL', 'IS NULL'
                - '=', '<', '>', '<>', '<=', '>=', 'LIKE', 'ILIKE', '~', '~*', 'in?, 'include?'
                - '= ANY' -  The value of this field (must be scalar) matches any value from the retrieved array field
                - '= ANY REV' -  Reverse the operator order
                - '<> ANY' -  The value of this field (must be scalar) must not match any value from the retrieved array field
                - '<> ANY REV' -  Reverse the operator order
                - '= ARRAY_LENGTH' -  The value of this field (must be integer) equals the length of the retrieved array field
                - '<> ARRAY_LENGTH' -  The value of this field (must be integer) must not equal length of the retrieved array field
                - '= LENGTH' -  The value of this field (must be integer) equals the length of the string (varchar or text) field
                - '<> LENGTH' -  The value of this field (must be integer) must not equal length of the string (varchar/text) field
                - '&&' -  There is an overlap, so any value of this field (an array) must be in the retrieved array field
                - '@>' -  This array field contains all of the elements of the retrieved array field
                - '<@' - This array field's elements are all found in the retrieved array field

              not: 'true|false (optional, default false) negate the result'
              value: |
                Any value, with defaults or substitutions, or a hash reference to another table field.

                [Substitutions](../general/substitutions.md) of data can be performed with `\{\{data_attribute\}\}` notation.
            
            json_field_element:
              element: 'key1.key2'
              value: 'literal value'
              condition: '(optional) - one of those listed above'

        all_special_conditions_with_return_flag:
          # A condition: hash may include exactly one return flag alongside the condition operator.
          # This simultaneously filters the query AND returns the field value as the result,
          # removing the need to duplicate the field with a separate return_value entry.
          # Specifying more than one return flag raises an error.
          model_table_name:
            field_to_both_filter_and_return:
              condition: 'IS NOT NULL'
              # exactly one of:
              return_value: true           # return the scalar field value
              # return_value_list: true    # return an array of all matching field values
              # return_result: true        # return the matched record instance
              # return_all_results: true   # return all matched record instances

        all_lookup_sub_query:
          # Use a 'lookup' key to derive a field's comparison value from an independent sub-query.
          # The sub-query is evaluated first; its result is substituted as the comparison value
          # for the enclosing field condition.
          # The sub-query runs independently (not joined to the outer scope), so it can safely
          # target the same table as the current record without causing a self-join error.
          # Supported / restricted usage:
          #   - Structure the sub-query like a normal ConditionalActions query rooted in a
          #     selection type (typically all:) and include no_masters: {} or masters: {} at
          #     that level. A malformed sub-query will fail at runtime.
          #   - lookup is intended only to supply comparison values for the outer query, so the
          #     supported return directives are return_value and return_value_list.
          #   - return_result and return_all_results are not supported inside lookup.
          #   - If no return directive is provided, or an unsupported return mode is used,
          #     lookup raises a runtime FphsException with the outer table / field context.
          no_masters: {}
          outer_table:
            field_a:
              lookup:
                all:
                  no_masters: {}
                  inner_table:
                    filter_field: 'x'
                    return_field: return_value

          # Lookup using a condition: return flag in the sub-query (filter and return same field):
          outer_table_condition_return:
            field_b:
              lookup:
                all:
                  no_masters: {}
                  inner_table:
                    filter_field: 'x'
                    another_field:
                      condition: 'IS NOT NULL'
                      return_value: true

          # Lookup with list return (IN semantics — field_c IN (...)):
          outer_table_list:
            field_c:
              lookup:
                all:
                  no_masters: {}
                  inner_table:
                    filter_field: 'y'
                    return_field: return_value_list

        any_save_trigger_results:
          # save_trigger_results are held for just the life of the transaction, and are not stored to the DB
          # They are set within specific save triggers (such as *pull_external_data*) when the
          # configuration `local_data: <key-name>` is set. 
          - this:
              save_trigger_results:
                element: '<local_data key-name>.<element_key>'
                value: |
                  match value or [substitutions](../general/substitutions.md)
          - this:
              save_trigger_results:
                element: '<local_data key-name>_http_response_code'
                value: 'match integer value or [substitutions](../general/substitutions.md), for example *200* for success'  

        ### Shortcuts for common conditions
        
        has_created_activity: <extra_log_type>
          # Has the specified extra_log_type been created in this activity log?
          # Equivalent to:
          #   all_completed_activity:
          #     definition_resources:
          #       extra_log_type: <extra_log_type String | Array>

        has_not_created_activity: <extra_log_type>
          # Has the specified extra_log_type not been created in this activity log?
          # Equivalent to:
          #   not_any_completed_activity:
          #     definition_resources:
          #       extra_log_type: <extra_log_type String | Array>
