# Report Options
# New report type `report` ignores legacy options. Legacy report types keep their
# current behavior and ignore the new options in these context-specific blocks.
view_options:
  # Shared view_options
  hide_table_names: false (default) | true
  # Hide table names that appear below field names.

  humanize_column_names: false (default) | true
  # Make column names friendly by removing underscores and capitalizing words.

  hide_result_count: false (default) | true
  # For report type `report`, hide only the count text. For legacy types this
  # retains its existing behavior, including hiding the count button.

  hide_export_buttons: false (default) | true
  # Hide CSV/JSON export buttons, even if the user may export those formats.

  hide_criteria_panel: false (default) | true
  # Hide the criteria panel in the report page, search panel, or embedded form.

  hide_field_names_with_comments: false (default) | true
  # Do not show field names when a field has a comment.

  show_column_comments: true | <array>
  # Show column comments for all result tables (true) or selected schema.table names.

  corresponding_data_dic: <string>
  # Force the use of a specific data dictionary for column labels.

  view_as: <string>
  # Render results as table (default), list, chart, calendar, transposed_table, or tree.

  show_all_booleans_as_checkboxed: false (default) | true
  # Show all boolean result cells as checkboxes.

  hide_list_labels_for_empty_content: false (default) | true
  # In list results, hide column labels when the content is blank.

  no_sorting: false (default) | true
  # Prevent dynamic sorting from being added to the results table.

  result_handlers:
    - fn1
    - fn2
  # JavaScript handler methods to call when results are shown.

  add_classes:
    - css-class-1
  # CSS classes to add to the result block.

  prevent_adding_items: false (default) | true
  # If the report is editable, prevent adding a new item.

  use_plain_attribute_names: false (default) | true
  # Allow plain URL attribute names when search_attrs[] is not specified.

  # Report page view_options (report type `report` only)
  hide_report_button: false (default) | true
  # Hide the report button. The button remains available to auto-submit.

  hide_count_button: false (default) | true
  # Hide the count button; does not hide the report's count text.

  show_list_records_button: false (default) | true
  # Show the list records button (commit=search); hidden by default.

  report_button_label: report (default) | <string>
  # Label for the report button.

  list_records_button_label: list records (default) | <string>
  # Label for the list records button.

  no_report_results_scroll: false (default) | true
  # Prevent scrolling to results and remove the back-to-form / show-results controls.

  auto_submit_on_load: false (default) | true
  # Submit automatically when the report page loads. force_run=true also submits.

  auto_submit_on_change: false (default) | true
  # Submit automatically when a criteria value changes.

  auto_submit_target: <string>
  # Target button: report by default, or list_records when hide_report_button is true.
  # Set to report or list_records to override the report-page target.

search_panel_options:
  search_records_button_label: search (default) | <string>
  # Label for the list records button in a search panel.

  hide_search_records_button: false (default) | true
  # Hide the search records button. The button remains available to auto-submit.

  prevent_collapse_for_search_panel_results: false (default) | true
  # Keep each master record expanded in search panel results.

  auto_submit_on_load: false (default) | true
  # Submit automatically when a search panel loads.

  auto_submit_on_change: false (default) | true
  # Submit automatically when a search panel criteria value changes. Legacy panels
  # auto-submit on change by default; set true when migrating to retain that behavior.

embedded_options:
  hide_report_button: false (default) | true
  # Hide the report button in an embedded modal. It remains available to auto-submit.

  report_button_label: report (default) | <string>
  # Label for the embedded report button.

  auto_submit_on_load: false (default) | true
  # Submit automatically when an embedded report loads.

  auto_submit_on_change: false (default) | true
  # Submit automatically when an embedded report criteria value changes.

# view_options (legacy)
# For legacy report types only, put these options under view_options: in real
# configurations. They are ignored for report type `report`.
#   hide_search_button: false (default) | true
#   hide_master_results_list_search_button: false (default) | true
#   force_show_search_button: false (default) | true
#   search_button_label: <string>
#   report_auto_submit_on_change: nil (default) | false | true
#   no_results_scroll: false (default) | true
#   prevent_collapse_for_list: false (default) | true

# Migration from legacy options for report type `report`:
# | Legacy key | New option |
# | hide_search_button | view_options.hide_report_button |
# | hide_master_results_list_search_button | search_panel_options.hide_search_records_button |
# | force_show_search_button | No direct equivalent; new buttons are not implicitly hidden by auto-run |
# | search_button_label | view_options.report_button_label or search_panel_options.search_records_button_label |
# | report_auto_submit_on_change | context-specific auto_submit_on_change |
# | no_results_scroll | view_options.no_report_results_scroll |
# | prevent_collapse_for_list | search_panel_options.prevent_collapse_for_search_panel_results |

list_options:
  hide_in_list: false (default) | true
  # Hide this report in the list of available reports, but still
  # allow it to be run

  list_description: <string>
  # Markdown formatted description to appear in the list of available reports,
  # allowing the main description field to appear just in the search criteria form

  get_query_count: false (default) | true
  # Automatically fetch the query count when the reports list page loads.
  # When true, the report will run to retrieve a count and populate search attribute
  # and result count cells in the reports list.

tree_view_options:
  # A tree view allows for drill down into lower levels.
  # A query must return an "id" field to operate, even if it is random.
  # For each level (except lowest level), provide list of column names to use as
  # the parent columns in the tree view
  # Expand the tree by default to the value set in *expand_level:*
  num_levels: 3
  expand_level: 1
  column_levels:
    -
      - col1
      - col2
    -
      - col3

plain_text_options:
  # If requesting results as plain text using a URL like:
  #   server.tld/reports/test__test_plain_text?format=text&search_attrs[a]=1
  # specify how the results are returned.
  
  # Content type to return in response
  return_content_type: text/plain (default), example: text/xml
  # Return a single column from a multicolumn query. If not set, all columns are returned
  results_column: column_name
  # Join columns with a character or string. Default '|'
  column_join_string: "\nValue:""
  # Prefix and suffix individual columns with strings. Default is no prefix.
  column_prefix: <col>
  column_suffix: </col>
  # Join lines with a character or string. Defaults to newline.
  line_join_string: "Line separator:-\n"
  # Prefix and suffix lines with strings. Default is no prefix.
  line_prefix: <line>
  line_suffix: </line>
  # Add header and footer text to the result. Default is no text.
  header_text: "<start>\n"
  footer_text: "\n</start>"
  # Specify a text template for each row returned with {{substitutions}}.
  # The header_text, footer_text, line_prefix, line_suffix and line_join_string may still be used, but
  # the template overrides the use of results_column, column_join_string, column_prefix and column_suffix.
  template: |
    - Employee Details:
        Employee ID: {{employee_id}}
        Name: {{first_name::titlize}} {{last_name::titlize}}  

json_options:
  # The format of the results:
  # - results_and_attributes - (default) returns {results: Array, search_attributes: Hash}
  # - results_only - returns an array of hash results
  # - row_template - returns an array, substituting data into a template hash, array or string for each row
  # - key_template - returns a hash keyed by the *key_column* value, substituting data into a template hash, array or string for each row
  show_as: results_and_attributes|results_only|row_template|key_template
  # Return a single row result as a hash rather than array if the result is a single row (or null if no results)
  # Default is false - to return a single result or zero row result as an array
  single_result: false|true
  # Template for the hash, array or string for each row. Use triple curly braces to get numbers without conversion to a string (1 not "1")
  template:
      employee:
        name: '{{first_name::titlize}} {{last_name::titlize}}'
        id: '{{{employee_id}}}'
      indicator: '{{user}}-{{res2}}'
  # The value of the named column to be used in the key_template format
  key_column: item_code

view_css:
  classes:
    a_class_name:
      min-width: 100%
      color: green
    another_class.subclass:
      display: none
  selectors:
    '#element-id':
      font-weight: bold
      font-size: 200%
    'p > span':
      font-decoration: underscore
  media_queries:
    "@media only screen and (min-width: 1180px)":
      '.someselectors':
        width: 75%

criteria_css:
  classes:
    a_class_name:
      min-width: 100%
      color: green
    another_class.subclass:
      display: none
  selectors:
    '#element-id':
      font-weight: bold
      font-size: 200%
    'p > span':
      font-decoration: underscore
  media_queries:
    "@media only screen and (min-width: 1180px)":
      '.someselectors':
        width: 75%


master_results_css:
  classes:
    a_class_name:
      min-width: 100%
      color: green
    another_class.subclass:
      display: none
  selectors:
    '#element-id':
      font-weight: bold
      font-size: 200%
    'p > span':
      font-decoration: underscore
  media_queries:
    "@media only screen and (min-width: 1180px)":
      '.someselectors':
        width: 75%

component:
  options:

column_options:
  tags: # HTML tag to use for specified column elements
    column_name: pre
    column_name_2: code
  classes: # List of CSS classes to add to each specified column element
    column_name:
      - class_1
      - class_2
    column_name_2:
  hide: # Hide the column from results
    column_name: true
  alt_column_header: # Show a different label for the column. Use an empty string '' to hide it
    column_name: Label

  show_as: # Special ways for showing specified columns
    column_name: url | checkbox | options | list | tags | embedded_block | fixed-pre
    # show the result as a: 
    # url - link to be opened in a new tab
    #   The content should be formatted using Markdown format
    #       [label for link](/url/path)

    # embedded_report - url linking to a report, to be opened in a modal popup for viewing
    #   The content should be formatted using Markdown format
    #       [label for link](/url/path)

    # embedded_block - url linking to a dynamic model, to be opened in a modal popup for viewing or editing
    #   A SQL field definition like this can be used:
    #      '/masters/' || master_id::varchar || '/dynamic_model/rc_q2_results/' || id::varchar "view results"
    #   or
    #      '/dynamic_model/rc_q2_results/' || id::varchar "view results"
    #   By default, a 'details' icon will be shown. To use defined text instead, use a markdown format link
    #      [label for link]('/dynamic_model/rc_q2_results/' || id::varchar "view results")
    
    # checkbox - checkbox shows as checked, unchecked or blank
    #   booleans (true | false | NULL)
    #   integer fields (1 | 0 | NULL)
    
    # choice_label - label from a choice, such as a general selection or the alt_options in a dynamic model
    #   An automatic match will be made where to find the choice labels to show

    # options - pretty presentation of a hash of {key: value} pairs
    # list - pretty presentation of a list (array) - bulletpoint default styling
    # tags - alternative to the list, showing items as tag items
    # fixed-pre - fixed length (not dynamic expandable) preformatted text, where all spaces and linebreaks are observed
    # markdown - markdown text converted to HTML

