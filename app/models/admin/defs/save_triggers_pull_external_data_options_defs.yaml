# Save Trigger: Pull External Data options
# Canonical schema
# pull_external_data: <Hash(entry_label: PullExternalDataEntry) | Array(Hash(entry_label: PullExternalDataEntry))>
#
# Key type
# entry_label: <any label - used to build the local_data / *_http_response_code substitution names>
#
# Value type
# PullExternalDataEntry: <Hash(
#   if: Condition,
#   force_not_editable_save: Boolean,
#   force_not_valid: Boolean,
#   local_data: String,
#   data_field: String,
#   data_field_format: <json>,
#   response_code_field: String,
#   method: <get | post>,
#   from: RequestValue,
#   to: RequestValue,
#   post_data: String | Hash,
#   success_if: Condition,
#   on_complete: TriggerTaskList,
#   on_failure: TriggerTaskList
# )>
# All keys are optional. method defaults to 'get'. Use from: for get requests (Pattern 1)
# and to: for post requests (Pattern 2) - see below.
#
# RequestValue type (from, to)
# RequestValue: <Hash(
#   url: String (required),
#   format: <xml | json | text>,
#   allow_empty_result: Boolean,
#   allow_response_codes: Array(Integer),
#   headers: Hash(header_name: String)
# )>
# Keys are optional unless marked (required). headers only applies to `to:` (post requests).
#
# Pattern 1: GET request (save_triggers_pull_external_data_pattern_1_get_defs.yaml)
# Pattern 2: POST request with headers and a body (save_triggers_pull_external_data_pattern_2_post_defs.yaml)
# See save_trigger_pull_external_data.md for the worked examples.

# Common keys - apply regardless of get/post
        pull_external_data:
          - this_1:
            if: if_extras
            force_not_editable_save: true allows the update to succeed even if this item is set as not_editable
            local_data: |
              (optional) name of attribute to store result to within the instance, for use in other triggers through substitutions, of format:
                \{\{save_trigger_results.<local_data name>.<element>\}\}
              
              Additionally, the response code for the request will be stored in save_trigger_results.<local_data name>_http_response_code

              For example, if local_data: 'identity', the request is stored to `save_trigger_results.identity` and an element of it can be
              accessed such as:
                  \{\{save_trigger_results.identity.access_token\}\}

              The corresponding response code will be available as:
                  \{\{save_trigger_results.identity_http_response_code\}\}

              If *success_if:* condition is set, the following will also be set
                  \{\{save_trigger_results.identity_success_if_res\}\}

              Details of the submitted request (for POST/PUT/PATCH body requests or POST form requests) will be stored as a hash in:
                  save_trigger_results.identity_submitted_request

              The submitted request hash contains:
                  data   - the request body as a Hash (for body/form requests), or nil for requests with no body (GET, HEAD, etc.)
                  url    - the resolved URL the request was sent to (with substitutions applied)
                  method - the HTTP method used (e.g. 'get', 'post', 'put')

              Individual elements can be accessed via substitutions, for example:
                  \{\{save_trigger_results.identity_submitted_request.url\}\}
                  \{\{save_trigger_results.identity_submitted_request.method\}\}
                  \{\{save_trigger_results.identity_submitted_request.data.programName\}\}

              These values are also available in if conditions like:
                  if:
                    this:
                      save_trigger_results:
                        element: identity.access_token
                        value: abc-123
                  
                  if:
                    this:
                      save_trigger_results:
                        element: identity_http_response_code
                        value: 200

                  if:
                    this:
                      save_trigger_results:
                        element: identity_success_if_res
                        value: true

                  if:
                    this:
                      save_trigger_results:
                        element: identity_submitted_request.url
                        value: https://example.com/api/endpoint

            data_field: (optional) name of text or json field to update
            data_field_format: |
              (optional) set to 'json' to store "data_field" in a text field with a real JSON representation.
              If not set, the result will be stored as a Ruby Hash string representation like {a => 1, b => "abc"}
            response_code_field: name of integer or string field to receive HTTP response code
            method: "(optional) default = 'get'. Other valid values: 'post'"

            # For 'get' requests
            from:
              url: url with substitutions
              format: xml|json|text
              allow_empty_result: true | false (default)
              allow_response_codes: [array of allowable integer codes that are not 200]

            # For 'post' requests
            to:
              url: url with substitutions
              format: xml|json|text
              allow_empty_result: true | false (default)
              allow_response_codes: [array of allowable integer codes that are not 200]
              headers:
                'Authorization': 'Bearer {{save_trigger_results.identity.access_token}}'
                'Content-Type': 'application/json'

            post_data: |
              For 'post' requests, the string or hash of data to post

            success_if: |
              Additional condition to check for success. For example:

                  all:
                    this:
                      save_trigger_results:
                        element: 'post_response.success'
                        value: true              
#!defs(save_triggers_lifecycle_hooks_defs.yaml)

# Notes:
# - Use from: for get requests and to: for post requests - only the one matching method:
#   is consulted; the other is ignored.
# - entry_label becomes the base of the local_data substitution names shown above.
# - success_if is checked in addition to the HTTP response code; a 200 response with a
#   failing success_if is still treated as unsuccessful.
