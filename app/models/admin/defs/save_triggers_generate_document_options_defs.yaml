# Save Trigger: Generate Document options
# Canonical schema
# generate_document: <Hash(entry_label: GenerateDocumentEntry) | Array(Hash(entry_label: GenerateDocumentEntry))>
#
# Key type
# entry_label: <any label - purely for identification>
#
# Value type
# GenerateDocumentEntry: <Hash(
#   content_template_name: String,
#   content_template_text: String,
#   layout_template: String,
#   extra_substitutions: Hash,
#   container: ContainerValue (required),
#   filename: String (required),
#   content_type: String,
#   path: String,
#   skip_existing: Boolean,
#   replace: Boolean,
#   store_as_user: String | Integer | Hash,
#   store_in_app_type: String | Integer | Hash,
#   if: Condition,
#   on_complete: TriggerTaskList,
#   on_failure: TriggerTaskList
# )>
# Keys are optional unless marked (required). Exactly one of content_template_name or
# content_template_text must be set - having neither raises an error.
#
# ContainerValue type (container) - exactly one lookup form should be used
# ContainerValue: <Hash(from_this: String) | Hash(name: String) | Hash(id: Integer | String)>
#
# Pattern 1: Named content template, container via model reference (save_triggers_generate_document_pattern_1_named_template_defs.yaml)
# Pattern 2: Inline content_template_text with layout and extra_substitutions (save_triggers_generate_document_pattern_2_inline_text_defs.yaml)
# Pattern 3: Resolve the container by name or id (save_triggers_generate_document_pattern_3_container_lookup_defs.yaml)
# See save_trigger_generate_document.md for the worked examples.

#!defs(save_triggers_lifecycle_hooks_defs.yaml)

# Notes:
# - container's three lookup forms (from_this/name/id) are mutually exclusive - use exactly one.
# - skip_existing and replace both apply to a duplicate filename+path match; skip_existing is
#   checked first, so setting both leaves skip_existing in control.
# - A generate_document result is typically referenced by a later notify trigger's
#   attachments: to email the generated file.
# - store_as_user/store_in_app_type accept a literal id/name, a {{curly}} substitution, or a
#   conditional Hash reference (e.g. {this: {field: return_value}}).
