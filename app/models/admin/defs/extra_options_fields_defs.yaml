# fields options
# Canonical schema
# fields: <Array(String)>
#
  fields:
  - field_name_1
  - field_name_2

# Notes:
# - Only fields listed here are displayed/editable for the option type; fields on the
#   underlying table that are omitted are neither shown nor form-submittable.
# - Order in the array is the display order.
# - For activity logs specifically, a field that also exists as an attribute on the
#   definition's parent item type is automatically excluded here (and from a traditional
#   field_list) - see the activity log documentation for details.
