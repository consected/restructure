# show_if options
# Canonical schema
# show_if: <Hash(show_if_target_key: ShowIfValue)>
#
# Key type
# show_if_target_key: <valid_field_name | /regex/ | submit_buttons_<button_id> | _anchor_name>
#
# Value type - a standard Condition (see conditions.md), which may also carry current_mode
# ShowIfValue: <Hash(current_mode: <show | edit>) | Condition>
# Condition: <Hash(selection_type: record_source: field_conditions)>
# All keys are optional.
#
# Pattern 1: Simple field-to-field condition (extra_options_show_if_pattern_1_simple_defs.yaml)
# Pattern 2: Combined conditions for one field - use all, any, not_all or not_any when the
#   field depends on more than one rule (extra_options_show_if_pattern_2_combined_defs.yaml)
# Pattern 3: Conditions that refer to an embedded item - embedded_item is available when the
#   current option type defines an embed: configuration (extra_options_show_if_pattern_3_embedded_item_defs.yaml)
# Pattern 4: Nested conditional groups with embedded_item (extra_options_show_if_pattern_4_nested_embedded_defs.yaml)
# Pattern 5: Apply the same condition to multiple fields using a regex key, e.g.
#   /^.+_complete/, field_[0-9], /^status_.*$/ (extra_options_show_if_pattern_5_regex_defs.yaml)
# Pattern 6: Control submit buttons instead of data fields (extra_options_show_if_pattern_6_submit_button_defs.yaml)
# See show_if.md for the worked examples.

# Notes:
# - Each top-level show_if entry must be a Hash of conditions.
# - show_if_condition_strings generates additional Hash entries in this same shape.
# - Field keys may be literal field names, regex keys or submit_buttons_<button_id>.
# - current_mode is commonly combined with field conditions, but still belongs in the same Hash.
