# show_if options
#
# Pattern 1: Simple field-to-field condition
  show_if:
    field_name:
      depends_on_field_name: conditional value
      current_mode: show | edit

# Pattern 2: Combined conditions for one field
# Use all, any, not_all or not_any when the field depends on more than one rule.
  show_if:
    field_name:
      all:
        depends_on_field_name: conditional value
        current_mode: show | edit
      any:
        alternative_field: another conditional value
      not_all:
        hidden_when_field: hidden value

# Pattern 3: Conditions that refer to an embedded item
# embedded_item is available when the current option type defines an embed:
# configuration or otherwise exposes embedded-item substitutions.
  show_if:
    field_depends_on_embedded_item:
      depends_on_field_name: conditional value
      embedded_item:
        field_name: conditional value
        field_name_2: conditional value

# Pattern 4: Nested conditional groups with embedded_item
  show_if:
    field_name:
      any:
        this_form_field: current value
        embedded_item:
          all:
            embedded_status: active
            embedded_score:
              condition: '>='
              value: 10

# Pattern 5: Apply the same condition to multiple fields using a regex key
# Example regex keys: /^.+_complete/, field_[0-9], /^status_.*$/
  show_if:
    /field_name_regex/:
      depends_on_field_name: conditional value
      current_mode: show | edit

# Pattern 6: Control submit buttons instead of data fields
  show_if:
    submit_buttons_<button_id>:
      current_mode: edit
      depends_on_field_name: conditional value

# Notes:
# - Each top-level show_if entry must be a Hash of conditions.
# - show_if_condition_strings generates additional Hash entries in this same shape.
# - Field keys may be literal field names, regex keys or submit_buttons_<button_id>.
# - current_mode is commonly combined with field conditions, but still belongs in the same Hash.
