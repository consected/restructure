# Save Trigger: Change User Roles options
        change_user_roles:
          if: if_extras
#!defs(save_triggers_lifecycle_hooks_defs.yaml)
        add_role_names:
          # app_type accepts an app type id (integer), an app type name (string), a
          # {{curly}} substitution, or a conditional Hash reference (e.g.
          # {this: {field: return_value}}). If omitted, defaults to the current user's app type.
          - app_type: study info
            role_name: viewer-has-agreement
            # Defaults to the current user
          - app_type: data-requests
            role_name: nfs_store group 600
            for_user: 
              this:
                created_by_user_id: return_value
          - app_type: study info
            role_name: 
              this:
                role_name_attr: return_value
            for_user: 
              this:
                user_email: return_value
        remove_role_names:
          - app_type: study info
            role_name: viewer-no-agreement
        