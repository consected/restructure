# save_action options
# Canonical schema
# save_action: <Hash(
#   label: String | Array(String),
#   on_create: SaveActionEventValue,
#   on_update: SaveActionEventValue,
#   on_save: SaveActionEventValue
# )>
# All keys are optional.
#
# SaveActionEventValue type (on_create / on_update / on_save)
# SaveActionEventValue: <Hash(
#   create_next_creatable: Hash(if: Condition),
#   show_panel: ActionEntry | Array(ActionEntry),
#   hide_panel: ActionEntry | Array(ActionEntry),
#   refresh_panel: ActionEntry | Array(ActionEntry),
#   expand_reference: ActionEntry | Array(ActionEntry),
#   go_to_master: Boolean,
#   redirect_to_url: ActionEntry
# )>
# All keys are optional.
#
# ActionEntry type
# ActionEntry: <Hash(value: String, if: Condition)>
# All keys are optional. Condition uses the standard conditions syntax, see conditions.md.
#
  save_action:
    label: button label 
    # May also use an array of labels for multiple alternative buttons, in combination with show_if control of the one shown
    on_update:
      create_next_creatable:
        if: 'ref: ** conditions reference **'
      show_panel:
        value: panel / category name
        if: 'ref: ** conditions reference **'
      hide_panel:
        value: panel / category name
        if: 'ref: ** conditions reference **'
      refresh_panel:
        - value: panel / category name
          if: 'ref: ** conditions reference **'
      expand_reference:
        - value: reference with caption - the option *if:* means the first matched item will be used as the value
          if: 'ref: ** conditions reference **'
        - value: next - this literal value tells the action to open the next available reference tab
          if: 'ref: ** conditions reference **'
      go_to_master: true
        # Reloads the page using the master id of the item.
        # This is often used when a new activity is created in the temporary master record and is subsequently
        # moved to a new master id.
      redirect_to_url:
        value: relative or absolute URL
        if: 'ref: ** conditions reference **'

    on_create: {}
    on_save:
      notes: |
        on_save: provides a shorthand for on_create and on_update. on_create
        and on_update override on_save configurations.

# Notes:
# - on_save cascades into on_create and on_update as a base (merged in first); any key
#   also present directly under on_create/on_update takes precedence over the on_save value.
# - expand_reference/refresh_panel accept a single ActionEntry or an ordered Array of them;
#   for expand_reference the first entry whose `if:` matches is used.
