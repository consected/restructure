# Pattern 4: Cross-reference sorting
view_options:
  sort_references:
    attribute: id | from_record_type | from_record_id | from_record_master_id | to_record_type | to_record_id | to_record_master_id | user_id | created_at | updated_at | disabled
    direction: asc | desc | reverse
    keep_top: true | false
    null_value: value used when the sorted attribute is null