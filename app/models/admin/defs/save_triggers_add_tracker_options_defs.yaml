# Save Trigger: Add Tracker options
# Canonical schema
# add_tracker: <Hash(entry_label: AddTrackerEntry) | Array(Hash(entry_label: AddTrackerEntry))>
#
# Key type
# entry_label: <valid Protocol name (recommended) | any label - see Notes>
#
# Value type
# AddTrackerEntry: <Hash(if: Condition, with: WithValue (required), on_complete: TriggerTaskList, on_failure: TriggerTaskList)>
# Keys are optional unless marked (required).
#
# WithValue type (with) - see Notes for protocol/sub_process resolution requirements
# WithValue: <Hash(
#   protocol_name: String,
#   protocol_id: Integer,
#   sub_process_name: String (required),
#   protocol_event_name: String,
#   event_date: String | Date | Timestamp,
#   notes: String,
#   item_type: String,
#   item_id: Integer,
#   master_id: Integer
# )>
# Keys are optional unless marked (required).
#
# Pattern 1: Basic tracker using the entry label as the protocol name (save_triggers_add_tracker_pattern_1_basic_defs.yaml)
# Pattern 2: Explicit protocol_name/protocol_id (save_triggers_add_tracker_pattern_2_explicit_protocol_defs.yaml)
# Pattern 3: Target a different item/master (save_triggers_add_tracker_pattern_3_alternative_target_defs.yaml)
# See save_trigger_add_tracker.md for the worked examples.

#!defs(save_triggers_lifecycle_hooks_defs.yaml)

# Notes:
# - entry_label should normally be a valid Protocol name, but any label may be used if
#   protocol_name or protocol_id is instead specified within with:.
# - The protocol must resolve to a real Classification::Protocol (via with.protocol_id,
#   with.protocol_name, or the entry_label itself) or the trigger raises 'Could not find
#   protocol name'. sub_process_name must then resolve to a real sub-process of that
#   protocol, or the trigger raises 'Could not find a sub process name'.
# - Substitutions in with: resolve against the current item and master record regardless
#   of which entry_label is used.
# - By default the tracker is tied to the current item and its master. item_type/item_id
#   and/or master_id override this to target a different item/master (Pattern 3).
# - add_tracker: may be given as a single Hash or an Array of Hashes to add multiple
#   tracker entries (including repeats of the same entry label) in one trigger task list.
