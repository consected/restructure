Name: |
  name shown in Reports list and searchable tabs
  
Short name: |
  identifier for the report, combined with Category to generate the full item type name used in URLs

Report type: |
  how the report will run and show results.

  - *report*: the current report type. It may show table, list, chart, or other configured results.
  - *count*: attempts to wrap the SQL as a `select count(*) from ...` query and display only the count
  - *(deprecated) regular report*: legacy report type, typically returns a table or the configured `view_as`
  - *(deprecated) report and list records*: legacy report type that displays results as a master record list
    (the SQL must return a `master_id` column)
Searchable: |
  show this report as a search panel on the user home page. This is the only setting that creates a search panel.

  The SQL must return a `master_id` column when the report is used to display master records in a search panel.
