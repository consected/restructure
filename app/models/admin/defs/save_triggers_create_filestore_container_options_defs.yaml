# Save Trigger: Create Filestore Container options
# Canonical schema
# create_filestore_container: <Hash(
#   name: String (required),
#   label: String,
#   create_with_role: String,
#   skip_if_exists: <master | user_is_creator>,
#   if: Condition,
#   on_complete: TriggerTaskList,
#   on_failure: TriggerTaskList
# )>
# Keys are optional unless marked (required).
#
# Pattern 1: Directory name from a literal/substituted string (save_triggers_create_filestore_container_pattern_1_basic_defs.yaml)
# Pattern 2: Directory name built from a list of attribute names (save_triggers_create_filestore_container_pattern_2_attribute_list_defs.yaml)
# See save_trigger_create_filestore_container.md for the worked examples.

#!defs(save_triggers_lifecycle_hooks_defs.yaml)

# Notes:
# - skip_if_exists: master or user_is_creator avoids creating a duplicate container if one
#   already exists in the selected reference scope.
# - name must resolve to a non-nil value - a nil name crashes with a NoMethodError rather
#   than a friendly validation error.
# - label is currently unused by the runtime handler (SaveTriggers::CreateFilestoreContainer)
#   despite being accepted in the config - documented for completeness, but has no effect.