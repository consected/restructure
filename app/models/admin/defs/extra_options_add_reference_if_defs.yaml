# add_reference_if options
# Canonical schema
# add_reference_if: <Condition>
#
# Condition type - see conditions.md for the full syntax
# Condition: <Hash(always: Boolean) | Hash(never: Boolean) | Hash(selection_type: record_source: field_conditions)>
#
# Pattern 1: Always allow adding the reference (extra_options_add_reference_if_pattern_1_always_defs.yaml)
# Pattern 2: Never allow adding the reference (extra_options_add_reference_if_pattern_2_never_defs.yaml)
# Pattern 3: Conditional reference addition (extra_options_add_reference_if_pattern_3_conditional_defs.yaml)
# See add_reference_if.md for the worked examples.

# Notes:
# - add_reference_if must be a Hash using the standard conditional-actions syntax.
# - Controls whether a reference to this option type can be added from another record's
#   references list - distinct from creatable_if, which controls direct creation.
