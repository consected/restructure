# Canonical schema
# _db_columns: <Hash(field_name: DbColumnValue)>
# All keys are optional.
#
# Value type
# DbColumnValue: <Hash(
#   type: String,
#   array: Boolean,
#   index: Boolean,
#   encrypted: Boolean,
#   hash_digest_class: <sha256 | sha1>
# )>
# All keys are optional.
#
# NOTE: db_configs may be found within the default: options in older configurations.
# Although not recommended, the old configuration will continue to work
_db_columns:
  field_name:
    type: force the field type (string, datetime, date, integer, float, decimal, bigint)
    array: false (default) | true - optional flag to indicate if this is an array type column
    index: false (default) | true - add an index
    encrypted: false (default) | true - use Rails encrypted attribute for transparent encryption/decryption
    hash_digest_class: sha256 (default) | sha1 - digest algorithm for encrypted field key derivation; use sha1 only to read pre-existing legacy-encrypted data
  field_name2:
    type: ...

# Notes:
# - hash_digest_class only accepts 'sha256' or 'sha1' (case-insensitive); any other value
#   is rejected. Use 'sha1' only to read pre-existing legacy-encrypted data - new encrypted
#   fields should use the 'sha256' default.
