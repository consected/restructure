# Save Trigger: Background options
#
# Canonical schema
# background: <TriggerTaskList>
#
# TriggerTaskList type - see save_trigger.md
# TriggerTaskList: <Array(Hash(trigger_type: TriggerConfig))>
#
# Pattern 1: Queue several triggers to run together (save_triggers_background_pattern_1_basic_defs.yaml)
# See save_trigger_background.md for the worked example and usage notes.

# Notes:
# - The queued job's result summary (status, item_class, item_id, trigger_count, queued_at)
#   is stored in save_trigger_results['background'], not the inner triggers' own results.
# - Individual triggers within the background job support on_complete and on_failure
#   lifecycle hooks - see the lifecycle hooks documentation for details.

