# Standard options to simplify configurations

_definitions___extra_options_standard_option_definitions___:

  # Usage:
  # any_option: *never
  any_option_never: &never
    never: true

  # Usage:
  #   extra_option_name:
  #     <<: *never_creatable
  creatable_if_never: &never_creatable
    creatable_if:
      never: true

  # Usage:
  #   extra_option_name:
  #     <<: *never_editable
  editable_if_never: &never_editable
    editable_if:  
      never: true

  # Usage:
  #   extra_option_name:
  #     <<: *never_showable
  showable_if_never: &never_showable
    showable_if:
      never: true

  # Usage:
  #   field_configs:
  #     field_name:
  #       <<: *never_show_field
  field_configs_show_if_never: &never_show_field
    show_if:
      never: true

  # Usage:
  #   condition_table:
  #     field_name: *is_blank
  field_is_blank: &is_blank
    - null
    - ''

  # Usage:
  #   condition_table:
  #     field_name: *is_not_blank
  field_is_blank: &is_not_blank
    condition: '<>'
    value: ''

  # Usage:
  #   condition_table:
  #     tag_field_name: *field_has_no_tags
  field_has_no_tags: &field_has_no_tags
    - null
    - []
    - ['']
