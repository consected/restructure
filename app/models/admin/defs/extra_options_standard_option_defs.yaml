# Standard options to simplify configurations

_definitions___extra_options_standard_option_definitions___:

  # Usage:
  #   extra_option_name:
  #     <<: *never_creatable
  creatable_if_never: &never_creatable
    creatable_if:
      never: true

  # Usage:
  #   extra_option_name:
  #     <<: *never_editable
  editable_if_never: &never_editable
    editable_if:  
      never: true

  # Usage:
  #   extra_option_name:
  #     <<: *never_showable
  showable_if_never: &never_showable
    showable_if:
      never: true

  # Usage:
  #   condition_table:
  #     field_name: *is_blank
  field_is_blank: &is_blank
    - null
    - ''

  # Usage:
  #   condition_table:
  #     field_name: *is_not_blank
  field_is_blank: &is_not_blank
    condition: '<>'
    value: ''
      
