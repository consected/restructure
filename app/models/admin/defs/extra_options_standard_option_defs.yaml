# Standard options to simplify configurations
# Canonical schema
# standard_options: <Hash(anchor_name: ConfigFragment)>
# ConfigFragment: <Hash | Array> - a reusable partial configuration value, referenced
# elsewhere via YAML anchor/alias syntax (`<<: *anchor_name` or `key: *anchor_name`).
# All keys are optional; anchor names are conventional, not schema-enforced.
#
_definitions___extra_options_standard_option_definitions___:

  # Usage:
  # any_option: *never
  any_option_never: &never
    never: true

  # Usage:
  #   extra_option_name:
  #     <<: *never_creatable
  creatable_if_never: &never_creatable
    creatable_if:
      never: true

  # Usage:
  #   extra_option_name:
  #     <<: *never_editable
  editable_if_never: &never_editable
    editable_if:  
      never: true

  # Usage:
  #   extra_option_name:
  #     <<: *never_showable
  showable_if_never: &never_showable
    showable_if:
      never: true

  # Usage:
  #   field_configs:
  #     field_name:
  #       <<: *never_show_field
  field_configs_show_if_never: &never_show_field
    show_if:
      never: true

  # Usage:
  #   condition_table:
  #     field_name: *is_blank
  field_is_blank: &is_blank
    - null
    - ''

  # Usage:
  #   condition_table:
  #     field_name: *is_not_blank
  field_is_not_blank: &is_not_blank
    condition: '<>'
    value: ''

  # Usage:
  #   condition_table:
  #     tag_field_name: *field_has_no_tags
  field_has_no_tags: &field_has_no_tags
    - null
    - []
    - ['']

  # Usage:
  #  condition_table:
  #    field_name: *is_falsey
  field_is_falsey: &is_falsey
      - null
      - false

  # Usage:
  #   condition_table:
  #     <<: *is_not_disabled
  is_not_disabled: &is_not_disabled
    disabled: 
      - null
      - false

# Notes:
# - The outer `_definitions___..._` key uses a deliberately unusual name to avoid
#   collision when injected via `@library` includes into a real configuration's own
#   `_definitions:` block, which is scanned and deleted by prefix.
# - Anchors are a YAML/authoring convenience only - they carry no runtime validation of
#   their own; the aliased value is validated wherever it is actually used (e.g. `never:
#   true` under `creatable_if:`).
