Table key name: |
  only used by *pick_multiple_records_from_table_...* form fields, which store the value of 
  this column for each record picked, falling back to the *primary key name* column when it is 
  blank. Typically blank.

  It plays no part in finding records, and nothing to do with the association to a master 
  record. Note that *select_record_from_table_...* fields ignore it, using 
  *field_options.edit_as.value_attr* instead.

Primary key name: |
  the column that uniquely identifies a record in this table, used to retrieve it to be viewed 
  or edited. Typically `id`, and set to `id` automatically when the definition is created if 
  the table has an `id` column. Set it explicitly only for a view or table with no `id` column.

Foreign key name: |
  the field used to match with a master record. Almost always `master_id`.

  If the table has a `master_id` column, this is set to `master_id` automatically when the 
  definition is created, whatever is entered here.

  Any other field name is only usable when it holds an external ID and 
  *_configurations.foreign_key_through_external_id* names the external identifier definition 
  holding the same value, which is what resolves the record to its master. Set on its own, a 
  field other than `master_id` gives no working master association and records fail to save. 
  A crosswalk field on the masters table, such as `msid`, can not be used here.

  If blank, then there is no connection to master records, but the table can be used for 
  lookups in forms using a field *select_record_from_table_...*

  This setting decides what conditional calculations and curly brace substitutions can 
  reach. See the general admin reference page *Scoping of Conditions and Substitutions*.

Category: |
  has two purposes:

  - simple category to organize dynamic model field definitions in the admin interface
  - allow page layout panels to show all dynamic models of a given category together
  
  NOTE: category `details` will show in the default participant info details panel
