Table key name: |
  the field used to uniquely identify a record when retrieving it to be viewed or edited. 
  It may be unrelated to the relationship between this item and a master record. Typically blank.
  
Primary key name: |
  the field that a master record may use to reference this record. Typically `id`

Foreign key name: |
  the field used to match with a master record. Typically this is `master_id`, 
  but may be one of the other fields on that table. 

  If blank, then there is no connection to master records, but the table can be used for 
  lookups in forms using a field *select_record_from_table_...*

Category: |
  has two purposes:

  - simple category to organize dynamic model field definitions in the admin interface
  - allow page layout panels to show all dynamic models of a given category together
  
  NOTE: category `details` will show in the default participant info details panel
