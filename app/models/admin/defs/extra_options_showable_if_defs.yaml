# showable_if options
# Canonical schema
# showable_if: <Condition>
#
# Condition type - see conditions.md for the full syntax
# Condition: <Hash(always: Boolean) | Hash(never: Boolean) | Hash(selection_type: record_source: field_conditions)>
#
# Pattern 1: Always show the option type (extra_options_showable_if_pattern_1_always_defs.yaml)
# Pattern 2: Never show the option type (extra_options_showable_if_pattern_2_never_defs.yaml)
# Pattern 3: Show only when conditions are met (extra_options_showable_if_pattern_3_conditional_defs.yaml)
# See showable_if.md for the worked examples.

# Notes:
# - showable_if must be a Hash using the standard conditional-actions syntax.
# - showable_if controls the visibility of the whole option type, whereas show_if controls individual fields or buttons.
