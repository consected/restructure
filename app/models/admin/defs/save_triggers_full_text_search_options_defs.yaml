# Save Trigger: Full Text Search options
# Canonical schema
# full_text_search: <Hash(entry_label: FullTextSearchEntry) | Array(Hash(entry_label: FullTextSearchEntry))>
#
# Key type
# entry_label: <any label - purely for identification>
#
# Value type
# FullTextSearchEntry: <Hash(
#   if: Condition,
#   source_fields: Array(String) (required),
#   target_column: String (required),
#   target_table: String,
#   target_foreign_key_column: String (required when target_table is set),
#   extra_content: String | {{substitution}},
#   ts_config: String,
#   on_complete: TriggerTaskList,
#   on_failure: TriggerTaskList
# )>
# Keys are optional unless marked (required). ts_config defaults to english.
#
# Pattern 1: Same-table mode - write directly to a tsvector column on this record's table (save_triggers_full_text_search_pattern_1_same_table_defs.yaml)
# Pattern 2: Separate-table mode - upsert into a target table via a foreign key reference (save_triggers_full_text_search_pattern_2_separate_table_defs.yaml)
# See save_trigger_full_text_search.md for the worked examples.
#
#!defs(save_triggers_lifecycle_hooks_defs.yaml)

# Notes:
# - full_text_search may be a single Hash or an Array of Hashes to build multiple indexes
#   from the same record (e.g. different source_fields into different target_columns).
# - Setting target_table switches from same-table mode (Pattern 1) to separate-table mode
#   (Pattern 2), which also requires target_foreign_key_column.
