# Save Trigger: Create Reference options
        create_reference:
          - model_name:
            if: if_extras
            in: |
              Specify the record from which the model reference is created (i.e., the "from" record).
              One of:
                - this (default: creates a reference from the current item)
                - referring_record (creates a reference from the record that referred to this item)
                - master (creates the new record under the master, without creating a model reference)
                - master_with_reference (creates the new record and a reference from the master record)
                - none (creates the record without any model reference — useful for standalone models)
                - specific_record: (creates a reference from a specified item, looked up by criteria)
                    resource_name:
                      criteria_field: criteria_value
                      id: return_value
              # Example using specific_record:
              # in:
              #   specific_record:
              #     activity_log__player_contact_phones:
              #       id: '{{some_field_id}}'
              #       return: return_result
              #
              # Standalone dynamic models (no_master_association, i.e. no master_id column) are
              # supported as targets. The record is created directly using the model class rather
              # than through the master association. All 'in:' options work with standalone models.

            force_create: 'true to force the creation of a reference and referenced object, independent of user access controls'
            force_not_valid: 'true to allow valid_if checks to be ignored'
            this_has_no_master_association: |
              true to force standalone resolution for the current (source) item, bypassing the
              master association lookup. Use this when the source item has no master_id and
              in: none is set, to ensure the target record is created directly using the model
              class rather than attempting to resolve through a master association.

            with_result: 
            # Map attributes from a related item to the target item.
            # A list of models to retrieve from and attributes to assign allow multiple sources to
            # be used.
            # NOTE: with: fields override any specified here
            # from: may also just take a simple String such as `from: embedded_item` to
            # as shorthand for the following full calculation
              - from:
                  embedded_item:
                    return: return_result
                attributes:
                  receipt_date: event_date
                  receipt_time: event_time
                  received_by: received_by
                  select_facility: 'Lab: {{select_lab}}'
                  # Substitutions use data only from the "from:" item

                  # Also set attributes in the embedded item
                  embedded_item:
                    rank: rank
                    rec_type: rec_type
                    data: '{{select_lab}}'
              - from: 
                  dynamic_model__some_recs:
                    return: return_result
                attributes:
                  a_value: value_from_result

#!defs(save_triggers_with_attribute_values_defs.yaml)
#!defs(save_triggers_lifecycle_hooks_defs.yaml)

            to_existing_record: # use an existing record of type "model_name", rather than creating a new one
              record_id: 'Hash with return_value, such as {model_name: {match: value, id: "return_value"\}\}'
          # NOTE: this sets:
          # - save_trigger_results.created_references (list of model_reference items created - skipped if an item wasn't created)
          # - save_trigger_results.created_items (list of created items - skipped if an item wasn't created)
          # - save_trigger_results.created_results (list of results indicating if an item was created based on "if:" conditions)
