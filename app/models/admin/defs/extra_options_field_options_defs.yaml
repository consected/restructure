# field_options options
# Canonical schema
# field_options: <Hash(field_name: FieldOptionValue)>
#
# Key type
# field_name: <valid_field_name>
#
# Value type
# FieldOptionValue: <Hash(
#   include_blank: Boolean,
#   pattern: String,
#   value: ValueExpr,
#   blank_value: ValueExpr,
#   preset_value: ValueExpr,
#   blank_preset_value: ValueExpr,
#   active_value: ActiveValueExpr,
#   no_downcase: Boolean,
#   view_original_case: Boolean,
#   view_with_formats: Array(String),
#   format: <plain | markdown>,
#   config: Hash,
#   edit_as: EditAsValue,
#   calculate_with: Hash,
#   prompt: String,
#   use_app_type: String,
#   selected: ValueExpr,
#   show_expanded: Boolean,
#   keep_label: Boolean,
#   class: String,
#   capitalize: Boolean,
#   default_value: String,
#   placeholder: String,
#   min: String,
#   max: String,
#   step: String
# )>
# All keys are optional.
#
# ValueExpr type (value, blank_value, preset_value, blank_preset_value, selected)
# ValueExpr: <String | now() | today() | {{substitution}} | ReturnValueLookup | Array(String)>
#
# ActiveValueExpr type (active_value)
# ActiveValueExpr: <String | now() | today() | {{substitution}} | ReturnValueLookup>
#
# ReturnValueLookup type - shared by ValueExpr and ActiveValueExpr
# ReturnValueLookup: <Hash(this | reference_<reference_name>: Hash(model_name: Hash(field_name: 'return_value')))>
#
# EditAsValue type (edit_as) - only relevant to select_ / select_record_* field types
# EditAsValue: <Hash(
#   field_type: String,
#   alt_options: Hash(label: value) | Array(String),
#   general_selection: String,
#   value_attr: String,
#   label_attr: String | Array(String),
#   group_split_char: String,
#   sort_order: String,
#   no_assoc: Boolean,
#   big_select: BigSelectValue,
#   select_filtering_target: String,
#   creatable: CreatableValue
# )>
# All keys are optional.
#
# BigSelectValue type (edit_as.big_select) - applies to select_record_* fields
# BigSelectValue: <Hash(hide_popover: Boolean, hide_key: Boolean, filtered: Boolean)>
# All keys are optional.
#
# CreatableValue type (edit_as.creatable) - applies to select_record_from_table_* fields
# CreatableValue: <Hash(enabled: Boolean)>
# All keys are optional.
#
# Pattern 1: Override field_type and alt_options (extra_options_field_options_pattern_1_edit_as_defs.yaml)
# Pattern 2: big_select basic (extra_options_field_options_pattern_2_big_select_basic_defs.yaml)
# Pattern 3: big_select with a '>>>' two-part display separator (extra_options_field_options_pattern_3_big_select_separator_defs.yaml)
# Pattern 4: big_select grouped by category (extra_options_field_options_pattern_4_big_select_grouped_defs.yaml)
# Pattern 5: big_select filtered by another field (extra_options_field_options_pattern_5_big_select_filtered_defs.yaml)
# Pattern 6: creatable - allow creating a new record inline (extra_options_field_options_pattern_6_creatable_defs.yaml)
# Pattern 7: value/preset_value via a return_value Hash lookup (extra_options_field_options_pattern_7_value_lookup_defs.yaml)
# Pattern 8: value/preset_value as an Array of strings (extra_options_field_options_pattern_8_value_array_defs.yaml)
# Pattern 9: active_value with a live substitution (extra_options_field_options_pattern_9_active_value_defs.yaml)
# See field_options.md for the worked examples.
#
  field_options:
    field_name:
      include_blank: |
        true or false to force a drop down field to include a selectable
        blank
      pattern: '.+\\d{3}-\\D{1-4}.*'
        # provide a mask for a text field using basic regex
        # This example accepts one or more characters of any type, 3 digits, a hyphen, 1 to 4 letters and any number of final characters
      value: ValueExpr - see 'Value, Preset, and Active Value Timing' in field_options.md
      blank_value: ValueExpr - see 'Value, Preset, and Active Value Timing' in field_options.md
      preset_value: ValueExpr - see 'Value, Preset, and Active Value Timing' in field_options.md
      blank_preset_value: ValueExpr - see 'Value, Preset, and Active Value Timing' in field_options.md
      active_value: ActiveValueExpr - see 'Value, Preset, and Active Value Timing' in field_options.md
      no_downcase: true - to prevent downcasing of the attribute when stored to the database
      view_original_case: true - to prevent the UI capitalizing downcased fields
      selected: ValueExpr - normally computed automatically, see field_options.md
      show_expanded: true - to render an embedded view-object list expanded (uncollapsed) by default
      keep_label: true - to keep showing the field label even where it would otherwise be hidden
      view_with_formats: |
        list of formatters to apply to a string field when being viewed
      format: plain | markdown - for free text editor fields such as notes and description
      config:
        _comment: additional configurations for editor fields
        toolbar_type: advanced - adds in additional editor toolbar controls
      edit_as: EditAsValue - see the edit_as/big_select/creatable sections in field_options.md
      calculate_with:
        sum: []
      prompt: used by some select fields for the placeholder prompt text
      use_app_type: |
        use the specified app type id or name instead of the user's current app type
        to filter protocol (and in the future other) selections

      # class, capitalize, default_value, placeholder, min, max, step are pass-through
      # HTML input hints, forwarded directly to the rendered form field
      class: additional CSS class(es) for the form field
      capitalize: true - to capitalize the displayed value
      default_value: HTML default value attribute for the form field
      placeholder: HTML placeholder attribute for the form field
      min: HTML min attribute, for numeric/date fields
      max: HTML max attribute, for numeric/date fields
      step: HTML step attribute, for numeric fields

# Notes:
# - See field_options.md for value/blank_value/preset_value/blank_preset_value/active_value
#   timing, edit_as/big_select/creatable semantics, pass-through HTML keys, and library
#   _default handling for fields absent from the current model.

