# Save Trigger: Redcap Request options
# Canonical schema
# redcap_request: <Hash(entry_label: RedcapRequestEntry) | Array(Hash(entry_label: RedcapRequestEntry))>
#
# Key type
# entry_label: <any label - purely for identification, referenced in on_complete examples below>
#
# Value type
# RedcapRequestEntry: <Hash(
#   study: String (required),
#   project_name: String (required),
#   local_data: String,
#   method: String (required),
#   post_data: Scalar | Array | Hash,
#   success_if: Condition,
#   force_not_editable_save: Boolean,
#   force_not_valid: Boolean,
#   data_field: String,
#   data_field_format: String,
#   response_code_field: String,
#   allow_empty_result: Boolean,
#   allow_response_codes: Array(Integer),
#   request_options: Hash,
#   on_complete: TriggerTaskList,
#   on_failure: TriggerTaskList,
#   if: Condition
# )>
# Keys are optional unless marked (required). See "Available methods" below for method values.
#
# Pattern 1: import_records - import a record into the project (save_triggers_redcap_request_pattern_1_import_records_defs.yaml)
# Pattern 2: survey_link - get a survey link for a record, chained after Pattern 1 (save_triggers_redcap_request_pattern_2_survey_link_defs.yaml)
# Pattern 3: remove_project_user - remove a user's access, with an on_complete follow-up request (save_triggers_redcap_request_pattern_3_remove_project_user_defs.yaml)
# Pattern 4: import_project_user - add a user or update their privileges (save_triggers_redcap_request_pattern_4_import_project_user_defs.yaml)
# See save_trigger_redcap_request.md for the worked examples.
#
#!defs(save_triggers_lifecycle_hooks_defs.yaml)

# Notes:
# - redcap_request may be a single Hash or an Array of Hashes to make multiple requests in
#   sequence within one trigger task list.
# - local_data is optional, but without it the response is not stored in save_trigger_results
#   and cannot be referenced by success_if or subsequent triggers.
# - success_if is evaluated against save_trigger_results.<local_data> after the request; if it
#   fails, the request is treated as unsuccessful even if the HTTP call itself succeeded.
# - The same handler and configuration is shared with batch_trigger's redcap_request entries.
                    