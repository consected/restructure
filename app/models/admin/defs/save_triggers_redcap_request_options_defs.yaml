# Save Trigger: Redcap Request options
        redcap_request:
          - request_1:
            # Import a record into the project and store the result in the local data.
            # The response should be a single element array (or more if extra data: array items are specified)
            # with the record id of the stored record.
            study: Test
            project_name: Test API
            local_data: import_response
            method: import_records
            post_data:
              data:
              - record_id: -1 # Note, a record_id is always needed, even with autonumbering
                study_id: '{{test_study_id}}'
              force_auto_number: true
            success_if:
              all:
                this:
                  save_trigger_results:
                    element: import_response
                    condition: "<> ARRAY_LENGTH"
                    value: 0
        - request_2:
            # If the previous record import was successful, go on to get the survey link
            # for the new record and save it to the data field. 
            # NOTE: the data field must be set to no_downcase: true and view_original_case: true in the field options,
            # otherwise the mixed case URLs will become mangled.
            # For example:
            #    default:
            #      field_options:
            #        econsent_rc_link:
            #          no_downcase: true
            #          view_original_case: true            
            study: Test
            project_name: Test API
            local_data: link_response
            method: survey_link
            force_not_editable_save: true
            data_field: econsent_rc_link
            data_field_format: txt
            post_data:
              instrument: research_form
              record_id: "{{save_trigger_results.import_response.first}}"
            success_if:
              all:
                this:
                  save_trigger_results:
                    element: link_response
                    condition: "<> LENGTH"
                    value: 0
        - request_3:
            # Remove a user's access from the REDCap project.
            # This can also be used within a batch_trigger definition, since batch
            # triggers share the same handler and configuration as save_trigger redcap_request.
            # The result is the count of users removed, as returned by the REDCap API.
            # Pass a single "username" (as shown below), or an array of usernames using
            # "usernames" instead, to remove multiple users in one request.
            # NOTE: the REDCap API user used for this project (the token owner) requires the
            # following privileges in the REDCap project: "API Import/Update",
            # "User Rights" (Full Access) and "Delete Records".
            # Removing a user does NOT automatically refresh the project's cached user list.
            # Use an on_complete hook (see below) to explicitly call project_users
            # with force_reload: true, if the refreshed list is needed straight away.
            study: Test
            project_name: Test API
            local_data: remove_user_response
            method: remove_project_user
            post_data:
              username: "{{item.username}}"
              # usernames: ["{{item.username}}", "{{item.other_username}}"]
            on_complete:
              - redcap_request:
                  request_3a:
                    # Force reload the cached project_users list from the REDCap API
                    # now that a user has been removed.
                    study: Test
                    project_name: Test API
                    local_data: remove_user_refreshed_users_response
                    method: project_users
                    post_data:
                      force_reload: true
