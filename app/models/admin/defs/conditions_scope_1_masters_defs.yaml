# Pattern 1: Widening the search beyond the current master
# @runnable: true
# @instance: activity_log
# @expect: true

# By default every table condition is joined to the current record's master, so
# only records belonging to that master are considered.
#
# `masters: {}` searches all master records instead. Conditions may be added to
# restrict which masters are searched, for example:
#
#   masters:
#     id:
#       - 1
#       - 2
#
# A crosswalk identifier can also be resolved this way, by matching a master
# record on one of its crosswalk attributes - the alternative ID columns held
# directly on the masters table - and returning its id:
#
#   all:
#     masters:
#       msid: 12345
#       id: return_value
#
# The masters table remains the base of the query, so every table named alongside
# `masters:` must have an association to the master record. Naming a standalone
# table (one whose definition has no foreign key name) fails with
# "Can't join 'Master' to association named '<resource_name>'" - use
# `no_masters: {}` for those instead.
all:
  masters: {}
  addresses:
    city: portland
    zip: '12345'
