# Save Trigger: Case options
#
# Canonical schema
# case: <Array(CaseBranch)>
#
# Value type
# CaseBranch: <Hash(when: Condition (required), then: TriggerTaskList (required)) | Hash(else: TriggerTaskList (required))>
# Keys are optional unless marked (required). Only the last branch may use `else:` (and
# only instead of `when:`/`then:`, not alongside them).
#
# TriggerTaskList type - see save_trigger.md
# TriggerTaskList: <Array(Hash(trigger_type: TriggerConfig))>
#
# TriggerTaskList type - see save_trigger.md
# TriggerTaskList: <Array(Hash(trigger_type: TriggerConfig))>
#
# Pattern 1: Branch on field value, with a fallback else (save_triggers_case_pattern_1_basic_defs.yaml)
# See save_trigger_case.md for the worked example and usage notes.

# Notes:
# - Branches are evaluated in array order; only the first matching branch's then: runs.
# - else: (if present) must be the last branch and has no when: of its own.
# - Individual triggers within case branches support on_complete and on_failure
#   lifecycle hooks - see the lifecycle hooks documentation for details.
