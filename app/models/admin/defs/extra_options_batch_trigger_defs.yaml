# batch_trigger options
# Canonical schema
# batch_trigger: <Hash(on_record: TriggerTaskList)>
# All keys are optional.
#
# TriggerTaskList type - same shape as save_trigger's, see extra_options_save_trigger_defs.yaml
# TriggerTaskList: <Hash(trigger_type: TriggerConfig) | Array(Hash(trigger_type: TriggerConfig))>
#
  batch_trigger:
    on_record:
      # On each record in the batch perform an appropriate trigger task, which is just the same as for save_trigger
      # In order to schedule a batch_trigger, see **_configurations:**
      <<: *trigger_tasks

# Notes:
# - on_record's trigger task list uses the same per-trigger-type validation rules as
#   save_trigger's event keys.
# - To schedule when/how often the batch runs, see _configurations.batch_trigger - that
#   is a separate scheduling config, not the task list itself.
