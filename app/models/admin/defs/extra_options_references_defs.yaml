# references options
# Canonical schema
# references: <Hash(model_name: ReferenceValue)>
#
# Value type
# ReferenceValue: <Hash(
#   label: String,
#   result_label: String,
#   from: <this | master | any | user_is_creator>,
#   without_reference: Boolean | <outside_master>,
#   add: <many | one_to_master | one_to_this>,
#   add_with: Hash,
#   filter_by: Hash,
#   order_by: Hash,
#   limit: Integer,
#   type_config: Hash,
#   view_as: ViewAsValue,
#   view_options: Hash,
#   showable_if: Condition,
#   creatable_if: Condition,
#   prevent_disable: Boolean | Condition,
#   also_disable_record: Boolean,
#   allow_disable_if_not_editable: Boolean | Condition,
#   prevent_reload_on_save: Boolean,
#   action_position: <top | bottom>
# )>
# All keys are optional.
#
# ViewAsValue type (view_as)
# ViewAsValue: <Hash(
#   edit: <hide | readonly | not_embedded | select_or_add>,
#   show: <hide | readonly | see_presence | filestore | as_edit>,
#   new: <outside_this | not_embedded | select_or_add>
# )>
# All keys are optional.
#
# Pattern 1: Simple reference definition (extra_options_references_pattern_1_simple_defs.yaml)
# Pattern 2: Reference with add_with and filter_by (extra_options_references_pattern_2_add_with_filter_defs.yaml)
# Pattern 3: Reference with ordering and activity selector (extra_options_references_pattern_3_order_type_config_defs.yaml)
# Pattern 4: Reference display behavior (extra_options_references_pattern_4_display_defs.yaml)
# Pattern 5: Reference disable behavior (extra_options_references_pattern_5_disable_behavior_defs.yaml)
# See references.md for the worked examples.

# Notes:
# - Each reference entry must be a Hash.
# - Top-level keys are reference model names; they may be declared in hash form or array form.
# - without_reference may be true, false or outside_master.
# - order_by applies within one reference definition; view_options.sort_references can reorder across all references.
# - Only the documented keys in each entry are supported for admin configuration.
