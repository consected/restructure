# view_options options
#
# Pattern 1: Basic display text and styling
  view_options:
    data_attribute: string or list of fields to use as the data attribute
    header_caption: header caption to use - may include {{substitutions}}
    alt_width_classes: html classes replacing standard col-* classes
    extra_class: additional html classes for the block
    view_handlers:
      - address
      - contact

# Pattern 2: Embedded-reference presentation
  view_options:
    show_embedded_at_top: true | false
    always_embed_reference: reference name | never
    always_embed_creatable_reference: reference name | never
    hide_unless_creatable: true | false
    only_create_as_reference: true | false

# Pattern 3: Alternative ordering of item lists
  view_options:
    alt_order: string or list of date / time / integer fields

# Pattern 4: Cross-reference sorting
# sort_references interacts with references.order_by by applying an overall sort across
# the combined reference results.
  view_options:
    sort_references:
      attribute: id | from_record_type | from_record_id | from_record_master_id | to_record_type | to_record_id | to_record_master_id | user_id | created_at | updated_at | disabled
      direction: asc | desc | reverse
      keep_top: true | false
      null_value: value used when the sorted attribute is null

# Pattern 5: Form button behavior
  view_options:
    show_cancel: true | false

# Notes:
# - view_options must be a Hash.
# - Only the documented top-level keys are supported.
# - data_attribute, alt_order and view_handlers may be a single string or an array of strings.
# - sort_references must be a Hash when present.
# - Boolean flags such as show_embedded_at_top, hide_unless_creatable, show_cancel and only_create_as_reference should use true or false.
# - Common extra_class values include prevent-reload-on-reference-save, no-scroll-on-click-edit,
#   make-labels-placeholders and hide-form-metadata.
