# view_options options
# Canonical schema
# view_options: <Hash(
#   data_attribute: String | Array(String),
#   header_caption: String,
#   alt_width_classes: String,
#   extra_class: String,
#   view_handlers: String | Array(String),
#   show_embedded_at_top: Boolean,
#   always_embed_reference: String | <never>,
#   always_embed_creatable_reference: String | <never>,
#   hide_unless_creatable: Boolean,
#   only_create_as_reference: Boolean,
#   alt_order: String | Array(String),
#   sort_references: SortReferencesValue,
#   show_cancel: Boolean
# )>
# All keys are optional.
#
# SortReferencesValue type (sort_references)
# SortReferencesValue: <Hash(
#   attribute: <id | from_record_type | from_record_id | from_record_master_id | to_record_type | to_record_id | to_record_master_id | user_id | created_at | updated_at | disabled>,
#   direction: <asc | desc | reverse>,
#   keep_top: Boolean,
#   null_value: Any
# )>
# All keys are optional.
#
# Pattern 1: Basic display text and styling (extra_options_view_options_pattern_1_basic_defs.yaml)
# Pattern 2: Embedded-reference presentation (extra_options_view_options_pattern_2_embedded_reference_defs.yaml)
# Pattern 3: Alternative ordering of item lists (extra_options_view_options_pattern_3_alt_order_defs.yaml)
# Pattern 4: Cross-reference sorting - sort_references interacts with references.order_by by
#   applying an overall sort across the combined reference results (extra_options_view_options_pattern_4_sort_references_defs.yaml)
# Pattern 5: Form button behavior (extra_options_view_options_pattern_5_form_button_defs.yaml)
# See view_options.md for the worked examples.

# Notes:
# - view_options must be a Hash.
# - Only the documented top-level keys are supported.
# - data_attribute, alt_order and view_handlers may be a single string or an array of strings.
# - sort_references must be a Hash when present.
# - Boolean flags such as show_embedded_at_top, hide_unless_creatable, show_cancel and only_create_as_reference should use true or false.
# - Common extra_class values include prevent-reload-on-reference-save, no-scroll-on-click-edit,
#   make-labels-placeholders and hide-form-metadata.
