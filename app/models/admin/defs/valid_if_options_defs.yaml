# valid_if options
#
# Pattern 1: Trigger map
# valid_if is a Hash keyed only by the save lifecycle trigger names below.
# Each trigger value must itself be a Hash containing conditional-actions syntax.
# on_save is merged into on_create and on_update as the default base definition.
  valid_if:
    on_save:
      all:
        this:
          field_name: expected_value
          invalid_error_message: Custom error message shown when validation fails
    on_create:
      all:
        this:
          create_only_field: expected_value
          invalid_error_message: Only checked on create
    on_update:
      all:
        this:
          update_only_field: expected_value
          invalid_error_message: Only checked on update

# Pattern 2: Simple validation against the current item
# Put invalid_error_message inside the this: block when validating attributes
# on the current item only.
valid_if:
  on_save:
    all:
      this:
        status: active
        invalid_error_message: Status must be active

# Pattern 3: Multiple current-item requirements in one validation block
# All field/value pairs inside the same this: block are evaluated together.
valid_if:
  on_save:
    all:
      this:
        status: active
        item_type: primary
        invalid_error_message: Record must have status=active and item_type=primary

# Pattern 4: Named validation wrapper for cross-table lookup
# Use a named wrapper when the validation refers to another table, especially
# with no_masters: {}.
valid_if:
  on_save:
    all:
      user_exists:
        invalid_error_message: This email address does not exist as a user of the system
        no_masters: {}
        users:
          email:
            this: email

# Pattern 5: Mixed validation blocks in one trigger
# A trigger may combine multiple named or unnamed validations using the normal
# all / any / not_* conditional-actions structure.
valid_if:
  on_save:
    all:
      this:
        status: active
        invalid_error_message: Status must be active
      user_exists:
        invalid_error_message: This email address does not exist as a user of the system
        no_masters: {}
        users:
          email:
            this: email

# Notes:
# - Top-level keys are limited to on_save, on_create and on_update.
# - Each trigger payload must be a Hash, not a String, Array or scalar value.
# - For simple this: conditions, place invalid_error_message inside the this: block.
# - For cross-table lookups, place invalid_error_message inside the named wrapper block.
# - Error messages appear as "<Field> invalid_error_message: <Message>" or
#   "<ConditionName> invalid_error_message: <Message>".
# - Validation happens before save_trigger actions.
# - All standard conditional-actions syntax is supported inside each trigger block.
# - Tested examples match spec/models/option_configs/valid_if_spec.rb.
