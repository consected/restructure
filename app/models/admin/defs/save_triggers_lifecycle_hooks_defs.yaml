# Save Trigger: Lifecycle Hooks (on_complete / on_failure)
# These options are automatically available on ALL save trigger types.
# They are implemented in the base class and applied to all current and future triggers.
# For triggers that accept multiple entries (e.g. add_tracker, update_this,
# create_reference), these options can be placed inside each named entry
# to run hooks per-entry.
#
# Canonical schema
# on_complete: <TriggerTaskList>
# on_failure: <TriggerTaskList>
#
# TriggerTaskList type - see save_trigger.md; a single trigger Hash or an Array of them
# TriggerTaskList: <Hash(trigger_type: TriggerConfig) | Array(Hash(trigger_type: TriggerConfig))>
# All keys are optional.
#
            on_complete: |
              (optional) triggers to run after successful completion.
              Accepts a single trigger hash or an array of trigger configurations.
              Can be placed at the top level of the trigger config, or inside
              each named entry for triggers that iterate multiple entries
              (e.g. add_tracker, create_reference, update_this).
              
              Example (top-level):
                on_complete:
                  - log:
                      message: 'Trigger completed successfully'
                      severity: info

              Example (per-entry, inside a named entry):
                add_tracker:
                  - Q1:
                      with:
                        sub_process_name: Review
                        protocol_event_name: Done
                      on_complete:
                        - log:
                            message: 'Tracker added successfully'
                            severity: info

            on_failure: |
              (optional) triggers to run if an exception is raised.
              Accepts a single trigger hash or an array of trigger configurations.
              By default, the original exception is NOT re-raised after on_failure executes, which prevents rolling back the DB transaction unless configured otherwise.
              To explicitly raise a new error or re-raise the original failure, use the `exception` trigger.
              Can be placed at the top level or inside each named entry,
              matching on_complete placement.

# Notes:
# - on_complete/on_failure are extracted before the owning trigger's own validation runs,
#   so they never appear as "unrecognized keys" even for triggers that don't declare them
#   in their own allowed_keys list.
# - Errors raised within an on_failure trigger itself are logged but do not replace or
#   suppress the exception that triggered it.
              
              Example:
                on_failure:
                  - log:
                      message: 'Trigger failed'
                      severity: error
                  - update_this:
                      one:
                        with:
                          status: failed
                  - exception:
                      original_failure: true
